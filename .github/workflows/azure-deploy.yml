name: Build and Deploy ASP.NET Core + Blazor to Azure App Service

on:
  push:
    branches:
      - main

env:
  AZURE_APPSERVICE_NAME: 'AppService-yuki2800-dev' # App Serviceの名称に変更
  DOTNET_VERSION: '10.0.x'                     # プロジェクトの net10.0 に合わせる
  API_TARGET_PATH: 'api-app'      # Azure側パスマッピングの物理パスと一致させる

permissions:
  id-token: write # azure/login (OIDC) に必要
  contents: read

jobs:
  build-and-deploy:
    runs-on: windows-latest # AzureがWindowsなのでビルド環境もWindowsを指定

    steps:
    # 1. リポジトリのコードをチェックアウト
    - name: Checkout GitHub Action
      uses: actions/checkout@v4

    # 2. .NET SDK のセットアップ
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    # 3. 自動テスト実行 + カバレッジ閾値未満ならワークフローを失敗させる
    - name: Run tests with coverage threshold
      run: |
        dotnet test test/InventoryManagement.Api.Tests/InventoryManagement.Api.Tests.csproj `
          -c Release `
          /p:CollectCoverage=true `
          /p:CoverletOutputFormat=cobertura `
          /p:Threshold=10 `
          /p:ThresholdType=line%2cbranch%2cmethod `
          /p:ThresholdStat=total

    # 4. frontend (Blazor WASM) のビルド・publish → App Serviceのルートに配置
    - name: Publish frontend (Blazor WASM)
      run: |
        dotnet restore src/frontend/InventoryManagement.Web.csproj
        dotnet publish src/frontend/InventoryManagement.Web.csproj -c Release -o ${{ runner.temp }}/frontend

    # 5. デプロイ用に成果物をZIP化（frontendはwwwroot配下のpublish出力のみ、backendはpublish出力全体）
    - name: Zip artifacts
      run: |
        Compress-Archive -Path "${{ runner.temp }}/frontend/*" -DestinationPath "${{ runner.temp }}/frontend.zip"

    # 7. Azure へログイン（federated credentialによるOIDC認証）
    - name: Azure Login
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    # 8. frontend を App Service のルート（site\wwwroot）へデプロイ
    - name: Deploy frontend to App Service root
      run: |
        az webapp deploy `
          --name ${{ env.AZURE_APPSERVICE_NAME }} `
          --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} `
          --src-path "${{ runner.temp }}/frontend.zip" `
          --type zip


    - name: Azure Logout
      if: always()
      run: az logout
